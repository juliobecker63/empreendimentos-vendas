# Enderecos exclusivos dos videos do YouTube (Shorts).
# O link na descricao do Short nao e clicavel: a pessoa digita o endereco falado no video.
# O redirecionamento acrescenta a etiqueta (UTM) para o Google Analytics mostrar de qual video veio.
# Aceita com ou sem hifen e com ou sem barra no fim (ex.: /aura-video, /auravideo, /aura-video/).
map $uri $yt_destino {
    default "";
    "~*^/aura-?video/?$"             "/aura/?utm_source=youtube&utm_medium=shorts&utm_campaign=aura";
    "~*^/vivanti-?video/?$"          "/vivanti/?utm_source=youtube&utm_medium=shorts&utm_campaign=vivanti";
    "~*^/viva-?urban-?video/?$"      "/viva-urban/?utm_source=youtube&utm_medium=shorts&utm_campaign=viva-urban";
    "~*^/viva-?serenita-?video/?$"   "/viva-serenita/?utm_source=youtube&utm_medium=shorts&utm_campaign=viva-serenita";
    "~*^/visio-?home-?video/?$"      "/visio-home/?utm_source=youtube&utm_medium=shorts&utm_campaign=visio-home";
    "~*^/comprar-?video/?$"          "/minha-casa-minha-vida/?utm_source=youtube&utm_medium=shorts&utm_campaign=como-comprar-1000";
    "~*^/mcmv-?video/?$"             "/minha-casa-minha-vida/?utm_source=youtube&utm_medium=shorts&utm_campaign=entrada-1000-viva-corp";
    "~*^/youtube/?$"                 "/?utm_source=youtube&utm_medium=canal&utm_campaign=perfil";
}

# Enderecos automaticos dos videos: /<pagina>-video ou /<pagina>-video-<extra>
# (ex.: /aura-video-2, /minha-casa-minha-vida-video-financiar). O <extra> vira sufixo da etiqueta.
map $yt_extra $yt_sufixo {
    default "-$yt_extra";
    "" "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # videos do YouTube: endereco exclusivo -> pagina com etiqueta (ver map $yt_destino)
    if ($yt_destino) {
        return 302 https://$host$yt_destino;
    }

    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '</head>' '<link rel="canonical" href="$canonical_base$canonical_path"/></head>';
    sub_filter 'contato@investirimoveisemflorianopolis.com' $footer_email;
    sub_filter '5548991480285' '${fone_digitos}';
    sub_filter '(48) 99148-0285' '${fone_fmt}';
    sub_filter '48 99148-0285' '${fone_fmt_curto}';
    sub_filter 'Investir Imóveis em Florianópolis' '${marca_longa}';
    sub_filter 'INVESTIR IMÓVEIS EM FLORIANÓPOLIS' '${marca_longa_caps}';
    # assunto do e-mail que chega na caixa (nao aparece na pagina)
    sub_filter 'Novo contato - Home Investir Imóveis' 'Novo contato - Home ${marca_curta}';
    # so troca a forma curta quando fecha titulo/atributo, para nao cortar a forma longa
    sub_filter '| Investir Imóveis<' '| ${marca_curta}<';
    sub_filter '| Investir Imóveis"' '| ${marca_curta}"';
    sub_filter '.brand .logo{height:104px' '.brand .logo{height:${logo_h_desktop}px';
    sub_filter '.brand .logo{height:74px}' '.brand .logo{height:${logo_h_mobile}px}';
    sub_filter '📍 Cidades ▾' '${menu_cidades}';
    sub_filter '<a class="nav-ddt" href="/sao-jose">' '<a class="nav-ddt" href="${ddt_saojose}">';
    sub_filter '<a class="nav-ddt" href="/palhoca">' '<a class="nav-ddt" href="${ddt_palhoca}">';
    sub_filter '<a class="nav-ddt" href="/biguacu">' '<a class="nav-ddt" href="${ddt_biguacu}">';
    sub_filter '<div class="nav-ddm"><a href="/apartamentos-venda">Florianópolis</a><a href="/sao-jose">São José</a><a href="/palhoca">Palhoça</a><a href="/biguacu">Biguaçu</a></div>' '${menu_sub}';

    location = /logo.png {
        try_files /$logo_file =404;
    }

    location = /sitemap.xml {
        try_files /$sitemap_file =404;
    }

    location = /robots.txt {
        try_files /$robots_file =404;
    }

    location ~ ^/apartamentos-venda/?$ {
        try_files /apartamentos-venda/$apv_file =404;
    }

    location = /apartamentos-venda/jb.html {
        internal;
    }

    location ~ ^/(sao-jose|palhoca|biguacu)(/|$) {
        if ($sem_cidades) {
            return 404;
        }
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # videos do YouTube (automatico): /<pagina>-video[-extra] -> /<pagina>/ com etiqueta.
    # Se a pagina nao existir, vai para a pagina inicial (a visita continua contada).
    location ~* "^/(?<yt_pg>[a-z0-9]+(?:-[a-z0-9]+)*?)-video(?:-(?<yt_extra>[a-z0-9]+(?:-[a-z0-9]+)*))?/?$" {
        if (-d $document_root/$yt_pg) {
            return 302 https://$host/$yt_pg/?utm_source=youtube&utm_medium=shorts&utm_campaign=$yt_pg$yt_sufixo;
        }
        return 302 https://$host/?utm_source=youtube&utm_medium=shorts&utm_campaign=$yt_pg$yt_sufixo;
    }

    # qualquer outro endereco terminado em -video (acento, simbolo): pagina inicial com etiqueta generica
    location ~* "^/[^/.]+-video(?:-[^/.]*)?/?$" {
        return 302 https://$host/?utm_source=youtube&utm_medium=shorts&utm_campaign=outro;
    }

    # scripts e estilos revalidam sempre (ETag): deploy novo -> navegador pega a versao nova
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
