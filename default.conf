map $host $footer_email {
    default contato@investirimoveisemflorianopolis.com;
    juliobecker.com.br contato@juliobecker.com.br;
    www.juliobecker.com.br contato@juliobecker.com.br;
}

map $host $logo_file {
    default logo.png;
    juliobecker.com.br logo-juliobecker.png;
    www.juliobecker.com.br logo-juliobecker.png;
}

map $host $logo_h_desktop {
    default 104;
    juliobecker.com.br 160;
    www.juliobecker.com.br 160;
}

# Dominio principal p/ o canonical. Para trocar o principal, mude o default abaixo.
map $host $canonical_base {
    default https://investirimoveisemflorianopolis.com;
}

# /pasta/index.html (resolvido pelo index) volta a ser /pasta/ no canonical
map $uri $canonical_path {
    default $uri;
    "~^(?<dir>.*/)(index|jb)\.html$" $dir;
}

map $host $sitemap_file {
    default sitemap.xml;
    juliobecker.com.br sitemap-juliobecker.xml;
    www.juliobecker.com.br sitemap-juliobecker.xml;
}

# /apartamentos-venda/ do Julio Becker: so imoveis novos e usados (sem lancamentos)
map $host $apv_file {
    default index.html;
    juliobecker.com.br jb.html;
    www.juliobecker.com.br jb.html;
}

# rotulo do menu (antes "Cidades"; agora "Imoveis a Venda" em todos os dominios)
map $host $menu_cidades {
    default "📍 Imóveis a Venda ▾";
    juliobecker.com.br "📍 Imóveis a Venda ▾";
    www.juliobecker.com.br "📍 Imóveis a Venda ▾";
}

# submenu do botao do menu (no Julio Becker: tipos de imovel em vez de cidades)
map $host $menu_sub {
    default "<div class=\"nav-ddm\"><a href=\"/apartamentos-venda\">Florianópolis</a><a href=\"/sao-jose\">São José</a><a href=\"/palhoca\">Palhoça</a><a href=\"/biguacu\">Biguaçu</a></div>";
    juliobecker.com.br "<div class=\"nav-ddm\"><a href=\"/apartamentos-venda/#apartamentos\">Apartamentos</a><a href=\"/apartamentos-venda/#casas\">Casas</a><a href=\"/apartamentos-venda/#terrenos\">Terrenos</a></div>";
    www.juliobecker.com.br "<div class=\"nav-ddm\"><a href=\"/apartamentos-venda/#apartamentos\">Apartamentos</a><a href=\"/apartamentos-venda/#casas\">Casas</a><a href=\"/apartamentos-venda/#terrenos\">Terrenos</a></div>";
}

map $host $ddt_biguacu {
    default "/biguacu";
    juliobecker.com.br "/apartamentos-venda";
    www.juliobecker.com.br "/apartamentos-venda";
}

map $host $ddt_palhoca {
    default "/palhoca";
    juliobecker.com.br "/apartamentos-venda";
    www.juliobecker.com.br "/apartamentos-venda";
}

map $host $ddt_saojose {
    default "/sao-jose";
    juliobecker.com.br "/apartamentos-venda";
    www.juliobecker.com.br "/apartamentos-venda";
}

# paginas de cidade fora do ar so no Julio Becker (404)
map $host $sem_cidades {
    default 0;
    juliobecker.com.br 1;
    www.juliobecker.com.br 1;
}

map $host $robots_file {
    default robots.txt;
    juliobecker.com.br robots-juliobecker.txt;
    www.juliobecker.com.br robots-juliobecker.txt;
}

map $host $logo_h_mobile {
    default 74;
    juliobecker.com.br 110;
    www.juliobecker.com.br 110;
}

# Nome da marca exibido (title, og:title, alt do logo, rodape)
map $host $marca_longa {
    default "Investir Imóveis em Florianópolis";
    juliobecker.com.br "Júlio Becker Investimentos Imobiliários";
    www.juliobecker.com.br "Júlio Becker Investimentos Imobiliários";
}

map $host $marca_curta {
    default "Investir Imóveis";
    juliobecker.com.br "Júlio Becker";
    www.juliobecker.com.br "Júlio Becker";
}

# versao em CAIXA ALTA da marca longa, usada nos headers de texto (nao imagem)
# das paginas isoladas oportunidade-investidores/quero-participar/emprestimo-simular
map $host $marca_longa_caps {
    default "INVESTIR IMÓVEIS EM FLORIANÓPOLIS";
    juliobecker.com.br "JÚLIO BECKER INVESTIMENTOS IMOBILIÁRIOS";
    www.juliobecker.com.br "JÚLIO BECKER INVESTIMENTOS IMOBILIÁRIOS";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '</head>' '<link rel="canonical" href="$canonical_base$canonical_path"/></head>';
    sub_filter 'contato@investirimoveisemflorianopolis.com' $footer_email;
    sub_filter 'Investir Imóveis em Florianópolis' '${marca_longa}';
    sub_filter 'INVESTIR IMÓVEIS EM FLORIANÓPOLIS' '${marca_longa_caps}';
    # assunto do e-mail que chega na caixa (nao aparece na pagina)
    sub_filter 'Novo contato - Home Investir Imóveis' 'Novo contato - Home ${marca_curta}';
    # so troca a forma curta quando fecha titulo/atributo, para nao cortar a forma longa
    sub_filter '| Investir Imóveis<' '| ${marca_curta}<';
    sub_filter '| Investir Imóveis"' '| ${marca_curta}"';
    sub_filter '.brand .logo{height:104px' '.brand .logo{height:${logo_h_desktop}px';
    sub_filter '.brand .logo{height:74px}' '.brand .logo{height:${logo_h_mobile}px}';
    sub_filter '📍 Cidades ▾' '${menu_cidades}';
    sub_filter '<a class="nav-ddt" href="/sao-jose">' '<a class="nav-ddt" href="${ddt_saojose}">';
    sub_filter '<a class="nav-ddt" href="/palhoca">' '<a class="nav-ddt" href="${ddt_palhoca}">';
    sub_filter '<a class="nav-ddt" href="/biguacu">' '<a class="nav-ddt" href="${ddt_biguacu}">';
    sub_filter '<div class="nav-ddm"><a href="/apartamentos-venda">Florianópolis</a><a href="/sao-jose">São José</a><a href="/palhoca">Palhoça</a><a href="/biguacu">Biguaçu</a></div>' '${menu_sub}';

    location = /logo.png {
        try_files /$logo_file =404;
    }

    location = /sitemap.xml {
        try_files /$sitemap_file =404;
    }

    location = /robots.txt {
        try_files /$robots_file =404;
    }

    location ~ ^/apartamentos-venda/?$ {
        try_files /apartamentos-venda/$apv_file =404;
    }

    location = /apartamentos-venda/jb.html {
        internal;
    }

    location ~ ^/(sao-jose|palhoca|biguacu)(/|$) {
        if ($sem_cidades) {
            return 404;
        }
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
