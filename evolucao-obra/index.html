<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Simule sua compra – Viva Corp</title>
<link rel="stylesheet" href="/evolucao-obra/estilo.css"></head><body>
<header><div class="wrap"><img src="/logo.png" alt="Logo"></div></header>
<div class="wrap">
<h1>Vamos simular a sua compra</h1>
<div id="ubox" class="ubox" hidden></div>
<div class="card">
<h2 style="margin-top:0">Você mora na Grande Florianópolis?</h2>
<div class="big"><a id="sim" href="#">Sim</a><a id="nao" href="#" class="alt">Não</a></div>
</div>
</div>
<script src="/evolucao-obra/dados.js"></script><script src="/evolucao-obra/comum.js"></script>
<script>
(function(){
  var q=C.qs(),emp=C.Q.get('emp'),un=C.Q.get('un'),t=C.Q.get('t'),v=+C.Q.get('v')||0;
  document.getElementById('sim').href='/evolucao-obra/perfil/'+q;
  document.getElementById('nao').href='/evolucao-obra/investidor/'+q;
  if(un){var e=document.getElementById('ubox'),nome=(DADOS.emp[emp]||{nome:'Viva Urban'}).nome;e.hidden=false;e.textContent='Imóvel selecionado: '+nome+' – apartamento '+un+(t?' (bloco/torre '+t.toUpperCase()+')':'')}
})();
</script>
</body></html>
